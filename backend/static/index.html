<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trợ lý PL Giao thông</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --accent: #3b82f6; --user-msg: #3b82f6; --bot-msg: #334155; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; height: 100vh; display: flex; flex-direction: column; }
        .header { padding: 20px; text-align: center; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid #334; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; max-width: 800px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        .message { padding: 12px 18px; border-radius: 12px; max-width: 85%; line-height: 1.6; }
        .message.user { background: var(--user-msg); align-self: flex-end; border-bottom-right-radius: 2px; }
        .message.bot { background: var(--bot-msg); align-self: flex-start; border-bottom-left-radius: 2px; white-space: pre-wrap; }
        .input-area { padding: 20px; background: var(--panel); display: flex; gap: 10px; max-width: 800px; margin: 0 auto; width: 100%; box-sizing: border-box; border-top-left-radius: 12px; border-top-right-radius: 12px; }
        input { flex: 1; padding: 15px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; outline: none; font-size: 16px; }
        button { padding: 15px 25px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; font-size: 16px; }
        button:hover { background: #2563eb; }
        .pending { color: #fbbf24; font-style: italic; }
        em { color: #93c5fd; font-style: normal; font-weight: 600; }
    </style>
</head>
<body>
    <div class="header">
        <h2 style="margin:0 0 5px 0;">🚦 Trợ lý Pháp luật Giao thông VN</h2>
        <a href="/admin" target="_blank" style="color: #94a3b8; font-size: 14px; text-decoration: none;">⚙️ Mở Admin Dashboard</a>
    </div>
    <div class="chat-container" id="chat">
        <div class="message bot">Xin chào! Tôi có thể giúp gì cho bạn về Luật Giao thông Việt Nam?</div>
    </div>
    <div class="input-area">
        <input type="text" id="prompt" placeholder="Hỏi tôi về luật giao thông..." onkeypress="if(event.key === 'Enter') send()">
        <button onclick="send()">Gửi</button>
    </div>

    <script>
        const threadId = crypto.randomUUID ? crypto.randomUUID() : 'thread-' + Math.random().toString(36).substr(2, 9);
        const chat = document.getElementById('chat');
        let pollingInterval = null;

        function addMessage(role, text, id='') {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            if(id) div.id = id;
            div.innerHTML = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        function formatCitation(text) {
            return text.replace(/\[(.*?)\](?!\()/g, '<em>[$1]</em>');
        }

        async function send() {
            const inp = document.getElementById('prompt');
            const q = inp.value.trim();
            if(!q) return;
            inp.value = '';
            
            addMessage('user', q);
            const botMsgId = 'bot-' + Date.now();
            const botDiv = addMessage('bot', '...', botMsgId);

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({question: q, thread_id: threadId})
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                
                while(true) {
                    const {done, value} = await reader.read();
                    if(done) break;
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n\n');
                    for(const line of lines) {
                        if(line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.replace('data: ', ''));
                                if(data.status === 'done') {
                                    botDiv.innerHTML = formatCitation(data.answer);
                                } else if(data.status === 'pending') {
                                    botDiv.innerHTML = `<span class="pending">⏳ ${data.message}</span>`;
                                    startPolling(botDiv);
                                } else if(data.status === 'error') {
                                    botDiv.innerHTML = `❌ Lỗi: ${data.message}`;
                                }
                            } catch(e) {}
                        }
                    }
                }
            } catch (e) {
                botDiv.innerHTML = `Lỗi kết nối: ${e}`;
            }
        }

        function startPolling(botDiv) {
            if(pollingInterval) clearInterval(pollingInterval);
            pollingInterval = setInterval(async () => {
                try {
                    const res = await fetch(`/status/${threadId}`);
                    const data = await res.json();
                    if(data.status === 'done') {
                        botDiv.innerHTML = formatCitation(data.answer);
                        clearInterval(pollingInterval);
                    }
                } catch(e) {}
            }, 3000);
        }
    </script>
</body>
</html>
