<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ Admin Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-dark: #090e17; 
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            --btn-approve: rgba(16, 185, 129, 0.9);
            --btn-approve-hover: #10b981;
            
            --btn-edit: rgba(59, 130, 246, 0.9);
            --btn-edit-hover: #3b82f6;
            
            --btn-reject: rgba(239, 68, 68, 0.9);
            --btn-reject-hover: #ef4444;
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.1), transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.05), transparent 40%);
            color: var(--text-main); 
            padding: 40px 20px; 
            margin: 0; 
            min-height: 100vh;
        }

        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h2 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .refresh-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid var(--glass-border);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .refresh-btn:hover { background: rgba(255, 255, 255, 0.2); }

        /* Grid hiển thị Cards */
        #list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
            gap: 24px;
        }

        .card { 
            background: var(--glass-bg); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 24px; 
            border-radius: 16px; 
            border: 1px solid var(--glass-border); 
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border-color: rgba(255,255,255,0.15);
        }

        .thread-id {
            color: var(--text-muted); 
            font-size: 0.85rem; 
            margin: 0 0 10px 0;
            background: rgba(0,0,0,0.3);
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .question {
            font-size: 1.1rem;
            margin: 0 0 15px 0;
            line-height: 1.5;
            color: #fff;
        }

        textarea { 
            width: 100%; 
            height: 150px; 
            background: rgba(0,0,0,0.2); 
            color: #e2e8f0; 
            border: 1px solid var(--glass-border); 
            border-radius: 10px; 
            padding: 15px; 
            font-family: inherit; 
            font-size: 0.95rem; 
            line-height: 1.6;
            box-sizing: border-box;
            resize: vertical;
            transition: border-color 0.2s;
            margin-bottom: 20px;
        }

        textarea:focus {
            outline: none;
            border-color: rgba(59, 130, 246, 0.5);
        }

        .btn-group { 
            display: grid; 
            grid-template-columns: 1fr 1fr 1fr; 
            gap: 12px; 
            margin-top: auto;
        }

        .action-btn { 
            padding: 12px; 
            border-radius: 8px; 
            border: none; 
            cursor: pointer; 
            font-weight: 600; 
            font-family: inherit;
            color: white; 
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-approve { background: var(--btn-approve); }
        .btn-approve:hover { background: var(--btn-approve-hover); box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);}
        
        .btn-edit { background: var(--btn-edit); }
        .btn-edit:hover { background: var(--btn-edit-hover); box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);}
        
        .btn-reject { background: var(--btn-reject); }
        .btn-reject:hover { background: var(--btn-reject-hover); box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);}

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            background: var(--glass-bg);
            border-radius: 16px;
            border: 1px dashed var(--glass-border);
        }

        /* Toast Notification System */
        #toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }

        .toast {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .toast.success { border-left: 4px solid #10b981; }
        .toast.error { border-left: 4px solid #ef4444; }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        @media (max-width: 768px) {
            #list { grid-template-columns: 1fr; }
            .btn-group { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>🛡️ HITL Admin Dashboard</h2>
            <button class="refresh-btn" onclick="loadPending()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                Làm mới
            </button>
        </div>
        
        <div id="list">
            <div class="empty-state">Đang tải dữ liệu...</div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icon = type === 'success' ? '✅' : '❌';
            toast.innerHTML = `<span>${icon}</span> <div>${message}</div>`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideOutRight 0.3s forwards';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        async function loadPending() {
            const list = document.getElementById('list');
            list.innerHTML = '<div class="empty-state">Đang đồng bộ dữ liệu...</div>';
            try {
                const res = await fetch('/pending');
                const data = await res.json();
                
                if(!data.pending || data.pending.length === 0) {
                    list.innerHTML = `
                        <div class="empty-state">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="1.5" style="margin-bottom:15px"><path d="M22 11.08V12a10.01 10.01 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                            <h3>Tất cả đã hoàn tất!</h3>
                            <p>Không có yêu cầu Web Search nào đang chờ duyệt.</p>
                        </div>`;
                    return;
                }
                
                list.innerHTML = '';
                data.pending.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `
                        <span class="thread-id">ID: ${p.thread_id.substring(0, 13)}...</span>
                        <div class="question">👤 ${p.question}</div>
                        <textarea id="draft_${p.thread_id}">${p.draft_answer || ''}</textarea>
                        <div class="btn-group">
                            <button class="action-btn btn-approve" onclick="resume('${p.thread_id}', 'approve')">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                Duyệt ngay
                            </button>
                            <button class="action-btn btn-edit" onclick="resume('${p.thread_id}', 'edit')">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                Sửa & Gửi
                            </button>
                            <button class="action-btn btn-reject" onclick="resume('${p.thread_id}', 'reject')">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                Từ chối
                            </button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            } catch(e) {
                list.innerHTML = `<div class="empty-state" style="color: #ef4444; border-color: #ef4444">Lỗi kết nối Backend: ${e}</div>`;
            }
        }

        async function resume(threadId, action) {
            const content = document.getElementById(`draft_${threadId}`).value;
            try {
                const res = await fetch('/resume', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({thread_id: threadId, action: action, edited_content: content})
                });
                const data = await res.json();
                if(data.status === 'success') {
                    showToast('Đã đẩy tin nhắn tới User thành công!', 'success');
                } else {
                    showToast('Lỗi từ Server: ' + data.message, 'error');
                }
            } catch(e) {
                showToast('Lỗi kết nối: ' + e, 'error');
            }
            // Đợi một chút rồi tải lại danh sách để animation mượt hơn
            setTimeout(loadPending, 400);
        }

        loadPending();
    </script>
</body>
</html>
