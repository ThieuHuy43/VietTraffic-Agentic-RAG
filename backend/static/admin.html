<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>🛡️ Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --accent: #10b981; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 30px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: var(--panel); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334; }
        textarea { width: 100%; height: 120px; background: #0f172a; color: white; border: 1px solid #475569; border-radius: 8px; padding: 15px; margin-top: 10px; font-family: inherit; font-size: 15px; box-sizing: border-box;}
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { padding: 12px 20px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; color: white; transition: 0.2s;}
        .btn-approve { background: #10b981; }
        .btn-edit { background: #3b82f6; }
        .btn-reject { background: #ef4444; }
        button:hover { filter: brightness(1.1); }
    </style>
</head>
<body>
    <div class="container">
        <h2>🛡️ HITL Admin Dashboard</h2>
        <button onclick="loadPending()" style="background: #475569; margin-bottom: 20px;">🔄 Làm mới danh sách</button>
        <div id="list">Đang tải...</div>
    </div>

    <script>
        async function loadPending() {
            const list = document.getElementById('list');
            list.innerHTML = 'Đang tải...';
            try {
                const res = await fetch('/pending');
                const data = await res.json();
                
                if(!data.pending || data.pending.length === 0) {
                    list.innerHTML = '<p>Không có yêu cầu nào đang chờ xử lý.</p>';
                    return;
                }
                
                list.innerHTML = '';
                data.pending.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `
                        <p style="color: #94a3b8; font-size: 14px; margin-top:0;">Mã Thread: ${p.thread_id}</p>
                        <p style="font-size: 18px;"><strong>Câu hỏi:</strong> ${p.question}</p>
                        <textarea id="draft_${p.thread_id}">${p.draft_answer || ''}</textarea>
                        <div class="btn-group">
                            <button class="btn-approve" onclick="resume('${p.thread_id}', 'approve')">✅ Duyệt</button>
                            <button class="btn-edit" onclick="resume('${p.thread_id}', 'edit')">✍️ Sửa & Gửi</button>
                            <button class="btn-reject" onclick="resume('${p.thread_id}', 'reject')">❌ Từ chối</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            } catch(e) {
                list.innerHTML = `<p style="color: #ef4444;">Lỗi kết nối Backend: ${e}</p>`;
            }
        }

        async function resume(threadId, action) {
            const content = document.getElementById(`draft_${threadId}`).value;
            try {
                const res = await fetch('/resume', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({thread_id: threadId, action: action, edited_content: content})
                });
                const data = await res.json();
                if(data.status === 'success') {
                    alert('Đã xử lý xong! Tin nhắn sẽ tự động hiển thị trên trình duyệt của User.');
                } else {
                    alert('Lỗi từ Server: ' + data.message);
                }
            } catch(e) {
                alert('Lỗi kết nối: ' + e);
            }
            loadPending();
        }

        loadPending();
    </script>
</body>
</html>
